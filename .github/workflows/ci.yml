name: CI

# Corre em todos os pushes (qualquer ramo, incluindo master) e em todos os
# pull requests. Sem filtro de "branches:", por isso não precisa de lista de
# ramos para se manter atualizado à medida que criares novos.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # Aplicado a todos os "run:" dos steps abaixo — evita repetir
    # "cd backend" em cada um.
    defaults:
      run:
        working-directory: backend

    # Sem service container de Postgres e sem env de DATABASE_URL: os
    # testes marcados "integration" (que precisam de um Postgres real e da
    # API do FastF1) ficam de fora deste workflow — ver o step de pytest
    # abaixo. Os restantes 82 testes usam só SQLite em memória
    # (tests/conftest.py) ou mocks, por isso este job não depende de mais
    # nada além do runner. Isso torna o CI hermético (não pode falhar por
    # causa da rede ou de um serviço externo indisponível) e mais rápido.

    steps:
      # 1. Vai buscar o código deste commit ao runner (sem isto, o runner
      #    começa vazio — nenhum step consegue ver o repositório).
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Instala o Python 3.11 (mesma versão do Dockerfile e do
      #    "requires-python" no pyproject.toml). "cache: pip" guarda a
      #    pasta de cache do pip entre execuções do workflow, indexada pelo
      #    hash dos ficheiros em "cache-dependency-path" — só volta a
      #    descarregar pacotes se requirements.txt/requirements-dev.txt
      #    mudarem, tal como a cache de camadas do Docker faz para os
      #    Dockerfiles.
      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # 3. requirements-dev.txt começa com "-r requirements.txt", por isso
      #    instalar só este ficheiro traz as duas listas (produção + dev:
      #    pytest, ruff, mypy, aiosqlite, ...).
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # 4. Lint — falha o job (exit code != 0) se o ruff encontrar
      #    problemas. Corre antes dos testes de propósito: dá feedback
      #    imediato sem esperar pela suite toda.
      - name: Lint (ruff)
        run: ruff check .

      # 5. Só os testes NÃO marcados "integration" (82 dos 91 totais).
      #    Os 9 restantes precisam de um Postgres real com as migrations
      #    aplicadas e/ou fazem pedidos de rede à API do FastF1 — nesta
      #    máquina de CI efémera não há cache do FastF1 aquecida, por isso
      #    falhavam (DataNotLoadedError) sempre que a sessão não estava já
      #    em cache. Correm-se à parte, localmente: ver README para o
      #    comando ("pytest -m integration").
      - name: Testes (pytest)
        run: pytest -m "not integration"
