services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
      POSTGRES_DB: pitwall
    ports:
      # Host port 5433 (not the default 5432) to avoid clashing with a
      # locally-installed PostgreSQL service, if you have one running.
      - "5433:5432"
    volumes:
      - pitwall_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall -d pitwall"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pitwall_postgres_data:
