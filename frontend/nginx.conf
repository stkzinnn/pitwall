server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: o react-router-dom trata rotas como "/race/123" só no
    # browser (client-side routing) — não existe um ficheiro "race/123.html"
    # em disco. Sem isto, recarregar a página (F5) numa rota que não seja
    # "/" dá 404 do nginx, porque ele tentaria encontrar esse ficheiro a
    # sério. "try_files" tenta o ficheiro pedido, depois a pasta, e por fim
    # cai sempre em index.html, deixando o React assumir o routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
